<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pao's Birthday — Legalmente Mayor 🎉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Satisfy&family=Raleway:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #F5F0E0;
  --red:   #CC1F2B;
  --dark:  #1A1A1A;
  --silver:#B8B8B8;
}

body {
  font-family: 'Raleway', sans-serif;
  background: var(--cream);
  color: var(--dark);
  min-height: 100vh;
  overflow-x: hidden;
}

.page {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 0 60px;
  position: relative;
  background: var(--cream);
  min-height: 100vh;
}

/* ── Decoraciones SVG de fondo ── */
.deco {
  position: absolute;
  pointer-events: none;
  z-index: 0;
}

/* Bola disco top-left */
.deco-disco-tl {
  top: -10px; left: -30px;
  width: 160px; opacity: .85;
}

/* Estrella roja */
.deco-stars-tl {
  top: 60px; left: 10px;
  width: 90px;
}

/* Labios top-center */
.deco-lips-tr {
  top: 0px; right: 20px;
  width: 120px; opacity: .9;
}

/* Número 18 */
.deco-18 {
  top: 10px; right: 10px;
  width: 110px;
}

/* Copa izquierda */
.deco-copa-l {
  top: 200px; left: 0px;
  width: 70px;
}

/* Estrella derecha */
.deco-stars-r {
  top: 280px; right: 5px;
  width: 80px;
}

/* Estrella bottom-left */
.deco-stars-bl {
  bottom: 350px; left: 5px;
  width: 90px;
}

/* Copa bottom-right */
.deco-copa-br {
  bottom: 380px; right: 5px;
  width: 70px;
}

/* Bola disco bottom-left */
.deco-disco-bl {
  bottom: 180px; left: -20px;
  width: 130px; opacity: .8;
}

/* Labios bottom-center */
.deco-lips-bc {
  bottom: 230px; left: 50%;
  transform: translateX(-60%);
  width: 100px; opacity: .85;
}

/* Bola disco bottom-right */
.deco-disco-br {
  bottom: 100px; right: -20px;
  width: 150px; opacity: .8;
}

/* Estrellas bottom-right */
.deco-stars-br {
  bottom: 270px; right: 0;
  width: 80px;
}

/* Destellos (sparkles) */
.deco-spark {
  font-size: 18px;
  color: var(--red);
  position: absolute;
  z-index: 0;
  animation: twinkle 2s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .3; transform: scale(.7); }
  to   { opacity: 1;  transform: scale(1.2); }
}

/* ── Contenido ── */
.content {
  position: relative;
  z-index: 1;
  padding: 0 24px;
}

/* Hero */
.hero {
  text-align: center;
  padding: 110px 16px 20px;
}

.hero-title {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(3rem, 11vw, 4.2rem);
  font-weight: 700;
  color: var(--dark);
  line-height: 1.1;
  margin-bottom: 2px;
}

.hero-sub {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(1.6rem, 6vw, 2.2rem);
  font-weight: 700;
  color: var(--dark);
  margin-bottom: 32px;
}

/* Sección de detalles */
.section {
  text-align: center;
  margin-bottom: 28px;
}

.section-q {
  font-family: 'Raleway', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: var(--dark);
  margin-bottom: 6px;
}

.section-val {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(1.9rem, 7vw, 2.6rem);
  font-weight: 700;
  color: var(--dark);
  line-height: 1.2;
}

.section-val-sm {
  font-family: 'Dancing Script', cursive;
  font-size: clamp(1.6rem, 6vw, 2.1rem);
  font-weight: 700;
  color: var(--dark);
}

/* Dress code */
.dress {
  text-align: center;
  margin: 8px 0 24px;
}

.dress-text {
  font-family: 'Raleway', sans-serif;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--dark);
}

/* Traer */
.traer {
  text-align: center;
  margin-bottom: 28px;
}

.traer-text {
  font-family: 'Dancing Script', cursive;
  font-size: 1.3rem;
  color: var(--dark);
}

/* Countdown */
.countdown-wrap {
  margin: 4px 0 28px;
}

.cd-label {
  font-family: 'Raleway', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: var(--dark);
  text-align: center;
  margin-bottom: 12px;
}

.cd-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 8px;
}

.cd-box {
  background: var(--dark);
  border-radius: 10px;
  text-align: center;
  padding: 12px 4px 10px;
}

.cd-num {
  font-family: 'Dancing Script', cursive;
  font-size: 2rem;
  font-weight: 700;
  color: #fff;
  display: block;
  line-height: 1;
}

.cd-box:nth-child(2) .cd-num { color: var(--red); }
.cd-box:nth-child(3) .cd-num { color: var(--silver); }
.cd-box:nth-child(4) .cd-num { color: #ccc; }

.cd-lbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #666;
  display: block;
  margin-top: 3px;
}

/* Confirma section */
.confirma-header {
  text-align: center;
  margin-bottom: 16px;
}

.confirma-title {
  font-family: 'Raleway', sans-serif;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--dark);
  margin-bottom: 8px;
}

.confirma-line {
  height: 3px;
  background: var(--red);
  border-radius: 2px;
  width: 80px;
  margin: 0 auto;
  transform: rotate(-1deg);
}

/* Mapa btn */
.map-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px;
  margin-bottom: 18px;
  background: transparent;
  border: 2px solid var(--dark);
  border-radius: 50px;
  font-family: 'Raleway', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--dark);
  text-decoration: none;
  cursor: pointer;
  transition: background .2s, color .2s;
}

.map-btn:hover { background: var(--dark); color: var(--cream); }

/* Form */
.form-lbl {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--dark);
  margin-bottom: 6px;
  margin-top: 14px;
}

.form-lbl:first-of-type { margin-top: 0; }

.form-input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255,255,255,.6);
  border: 1.5px solid #C8BFA0;
  border-radius: 8px;
  font-family: 'Raleway', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--dark);
  outline: none;
  transition: border-color .2s;
}

.form-input:focus { border-color: var(--red); }
.form-input::placeholder { color: #BBB0A0; }
.form-input:disabled { opacity: .5; }

.submit-btn {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  background: var(--dark);
  color: var(--cream);
  border: none;
  border-radius: 50px;
  font-family: 'Raleway', sans-serif;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: .15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity .2s;
}

.submit-btn:hover:not(:disabled) { opacity: .85; }
.submit-btn:disabled { opacity: .5; cursor: not-allowed; }

.status {
  padding: 11px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  margin-top: 10px;
  text-align: center;
  display: none;
}

.status.ok  { background: #E8F5E1; border: 1.5px solid #5A9A3A; color: #2E6010; display: block; }
.status.err { background: #FDE8E8; border: 1.5px solid var(--red); color: var(--red); display: block; }

.footer {
  text-align: center;
  padding: 32px 16px 0;
  font-family: 'Dancing Script', cursive;
  font-size: 1.1rem;
  color: #888;
}

.sep {
  width: 2px;
  height: 30px;
  background: var(--red);
  margin: 0 auto 28px;
  border-radius: 2px;
  transform: rotate(2deg);
}
</style>
</head>

    <input class="form-input" type="text" id="nombre" placeholder="Tu nombre completo" maxlength="80">

    <label class="form-lbl" for="celular">Celular (10 dígitos)</label>
    <input class="form-input" type="tel" id="celular" placeholder="33 1234 5678" maxlength="15">

    <button class="submit-btn" id="rsvp-btn" onclick="enviarRSVP()">
      Confirmar asistencia
    </button>
    <div class="status" id="status-msg"></div>

<script>
  const API_URL    = "http://localhost:5000";
  const PARTY_DATE = new Date("2026-07-04T19:30:00");
  const MAP_LAT    = 20.74886126236008;
  const MAP_LNG    = -103.43791210737095;
  const MAP_LABEL  = "Quinta García, Zapopan, Jalisco";

  function pad(n){ return String(n).padStart(2,'0'); }

  function tick(){
    const diff = PARTY_DATE - new Date();
    const el   = document.getElementById('cd');
    if(diff <= 0){
      el.innerHTML = '<div style="grid-column:1/-1;text-align:center;font-family:Dancing Script,cursive;font-size:1.6rem;color:#CC1F2B;padding:10px">¡Hoy es la fiesta! 🎉</div>';
      return;
    }
    const days = Math.floor(diff/864e5);
    const hrs  = Math.floor(diff%864e5/36e5);
    const min  = Math.floor(diff%36e5/6e4);
    const sec  = Math.floor(diff%6e4/1e3);
    el.innerHTML = `
      <div class="cd-box"><span class="cd-num">${pad(days)}</span><span class="cd-lbl">Días</span></div>
      <div class="cd-box"><span class="cd-num">${pad(hrs)}</span><span class="cd-lbl">Horas</span></div>
      <div class="cd-box"><span class="cd-num">${pad(min)}</span><span class="cd-lbl">Min</span></div>
      <div class="cd-box"><span class="cd-num">${pad(sec)}</span><span class="cd-lbl">Seg</span></div>`;
  }

  tick(); setInterval(tick, 1000);

  function openMap(e){
    e.preventDefault();
    const enc   = encodeURIComponent(MAP_LABEL);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    window.open(
      isIOS ? `maps://?q=${enc}&ll=${MAP_LAT},${MAP_LNG}`
            : `https://www.google.com/maps/search/?api=1&query=${MAP_LAT},${MAP_LNG}`,
      '_blank'
    );
  }

  async function enviarRSVP(){
    const nombre  = document.getElementById('nombre').value.trim();
    const celular = document.getElementById('celular').value.trim();
    const btn     = document.getElementById('rsvp-btn');
    document.getElementById('status-msg').className = 'status';

    if(!nombre)  { showSt('err','Escribe tu nombre'); return; }
    if(!celular) { showSt('err','Escribe tu celular'); return; }

    btn.disabled = true; btn.textContent = 'Enviando...';

    try{
      const r    = await fetch(`${API_URL}/rsvp`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nombre,celular})
      });
      const data = await r.json();
      if(r.ok){
        showSt('ok', data.mensaje);
        btn.textContent = '✓ Confirmado';
        document.getElementById('nombre').disabled  = true;
        document.getElementById('celular').disabled = true;
      } else {
        showSt('err', data.error||'Algo salió mal');
        btn.disabled=false; btn.textContent='Confirmar asistencia';
      }
    } catch {
      showSt('err','Sin conexión con la API');
      btn.disabled=false; btn.textContent='Confirmar asistencia';
    }
  }

  function showSt(type,msg){
    const el = document.getElementById('status-msg');
    el.className = `status ${type}`;
    el.textContent = msg;
  }
</script>
